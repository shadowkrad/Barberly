<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="barberlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="barberlyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="barberDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#barberlyBg)"/>
  <rect width="512" height="256" rx="115" fill="url(#barberlyGlow)"/>
  <!-- Cornice sottile oro/lusso -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Icona Forbici & Pettine da Barbiere -->
  <g filter="url(#barberDrop)" transform="translate(256, 256)">
    <!-- Pettine inclinato a 45 gradi -->
    <g transform="rotate(-35)">
      <!-- Dorso pettine -->
      <rect x="-140" y="-18" width="280" height="36" rx="8" fill="url(#goldGrad)"/>
      <!-- Denti del pettine -->
      <path d="
        M-120 18 L-120 70 M-105 18 L-105 70 M-90 18 L-90 70 M-75 18 L-75 70
        M-60 18 L-60 70 M-45 18 L-45 70 M-30 18 L-30 70 M-15 18 L-15 70
        M0 18 L0 70 M15 18 L15 70 M30 18 L30 70 M45 18 L45 70
        M60 18 L60 70 M75 18 L75 70 M90 18 L90 70 M105 18 L105 70 M120 18 L120 70
      " stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Forbici professionali da barbiere in primo piano -->
    <g transform="rotate(25)">
      <!-- Lama 1 -->
      <path d="M-8 0 L-6 -140 Q-2 -155 0 -160 Q2 -155 6 -140 L8 0 Z" fill="#ffffff"/>
      <!-- Lama 2 -->
      <path d="M-8 0 L-6 140 Q-2 155 0 160 Q2 155 6 140 L8 0 Z" fill="#ffffff" fill-opacity="0.9"/>
      <!-- Perno centrale oro -->
      <circle cx="0" cy="0" r="14" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
      <!-- Impugnatura e anelli -->
      <g transform="translate(0, 70)">
        <path d="M-6 0 L-25 45 Q-45 80 -15 105 Q15 130 35 95 Q45 70 10 40 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>